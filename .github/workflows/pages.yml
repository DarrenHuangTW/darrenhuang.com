name: Deploy Astro site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify source quality and migration integrity
        run: |
          npm run format:check
          npm run lint
          npm run check
          npm run typecheck
          npm test
          npm run verify:migration

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Verify project-base preview build end to end
        run: |
          npm run build
          npm run verify:dist
          npm run test:e2e
        env:
          SITE_URL: https://darrenhuangtw.github.io
          BASE_PATH: /darrenhuang.com

      - name: Build verified custom-domain artifact
        run: |
          npm run build
          npm run verify:dist
        env:
          SITE_URL: https://www.darrenhuang.com
          BASE_PATH: /

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload verified site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
